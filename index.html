<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwind style -->
    <link rel="stylesheet" href="tailwind/tailwind.css">
    <title>Payoo</title>
</head>
<body class="bg-[#F4F5F7] flex justify-center items-center flex-col min-h-screen ">
    <div class="bg-[url(/assets/bg.png)] w-90 h-30 bg-cover flex justify-center items-center">
        <img src="assets/Group.png" alt="" >
    </div>
    <form class=" bg-white p-8 w-100 rounded-xl ">
        <div>
            <label for="" class="font-medium"">Mobile Number</label>
            <br>
            <input id="input-number" type="text" placeholder="Enter Your Number" class="rounded-full bg-[#F4F5F7] px-5 py-2 mt-3 w-full " >
        </div>
        <div class="mt-4">
            <label for="" class="font-medium"">4 Digit pin</label>
            <br>
            <input id="input-pin" type="text" placeholder="Enter Your 4 Digit Pin" class="rounded-full bg-[#F4F5F7] px-5 py-2 mt-3 w-full " >
        </div>
        <button id="btn-login" class="btn text-white w-full bg-[#0874F2] rounded-full text-center py-2 mt-4 font-medium">Log in</button>
    </form>
    <script src="script.js">

    </script>
</body>
</html>
